version: "3.8"

services:
  lnd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lnd-dropper
    restart: unless-stopped
    ports:
      - "${LND_PORT:-4200}:4200"
    environment:
      - LND_PORT=4200
    # Persist uploaded files across container rebuilds
    volumes:
      - ./uploads:/app/uploads
    # mDNS requires host network on some setups.
    # For Hass OS / Raspberry Pi, try "host" if device discovery doesn't work.
    # Uncomment the next line if needed:
    # network_mode: host

networks:
  default:
    name: lnd-network
    driver: bridge