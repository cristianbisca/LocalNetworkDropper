version: "3.8"

services:
  lnd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lnd-dropper
    restart: unless-stopped
    ports:
      - "13010:3000"
    environment:
      LND_PORT: "3000"
      # Authentication (optional - set via Portainer env vars or .env file)
      LND_USER: ${LND_USER:-}
      LND_PASSWORD: ${LND_PASSWORD:-}
      # Debug mode (optional)
      LND_DEBUG: "${LND_DEBUG:-false}"
    # Persist uploaded files across container rebuilds
    volumes:
      - lnd_uploads:/app/uploads

volumes:
  lnd_uploads:
    driver: local