version: "3.8"

services:
  lnd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lnd-dropper
    restart: unless-stopped
    ports:
      - "${LND_PORT:-4200}:4200"
    environment:
      - LND_PORT=4200
      # Authentication (optional - set to enable)
      - LND_USER=${LND_USER:-}
      - LND_PASSWORD=${LND_PASSWORD:-}
      # Debug mode (optional)
      - LND_DEBUG=${LND_DEBUG:-false}
    # Persist uploaded files across container rebuilds
    volumes:
      - lnd_uploads:/app/uploads

volumes:
  lnd_uploads:
    driver: local